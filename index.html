<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kütüphane Sistemi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f0f4f8;
    color: #1a2332;
    min-height: 100vh;
    padding: 24px;
  }

  h1.site-title {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #1a2332;
    margin-bottom: 28px;
    text-transform: uppercase;
  }

  .screen-stack {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
  }

  .panel {
    background: #ffffff;
    border: 1.5px solid #c9d6e3;
    border-radius: 10px;
    padding: 22px 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .panel h2 {
    font-size: 1rem;
    font-weight: 700;
    color: #1a2332;
    margin-bottom: 16px;
  }

  /* ── BOX 1: Kitap Ödünç Alma / İade Etme ── */
  .checkout-flow {
    display: grid;
    grid-template-columns: 1fr 32px 1fr;
    gap: 12px;
    align-items: start;
  }

  .flow-col { display: flex; flex-direction: column; gap: 10px; }

  .flow-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 36px;
    color: #3b82f6;
    font-size: 1.4rem;
  }

  .input-field {
    border: 1.5px solid #c9d6e3;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.85rem;
    width: 100%;
    color: #1a2332;
    background: #f8fafc;
    outline: none;
    transition: border-color 0.15s;
  }
  .input-field:focus { border-color: #3b82f6; background: #fff; }
  .input-field::placeholder { color: #9aacbe; }

  .greeting-box {
    background: #f0f9ff;
    border: 1.5px solid #bae0fd;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 0.83rem;
    color: #1a6aa8;
    font-weight: 600;
  }

  .btn {
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-danger  { background: #ef4444; color: #fff; }
  .btn-gray    { background: #e2e8f0; color: #374151; }
  .btn-green   { background: #22c55e; color: #fff; }
  .btn-outline {
    background: transparent;
    border: 1.5px solid #3b82f6;
    color: #3b82f6;
  }

  .info-card {
    background: #fefce8;
    border: 1.5px solid #fde68a;
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 0.8rem;
    color: #92400e;
    line-height: 1.5;
  }

  .separator {
    border: none;
    border-top: 1.5px dashed #c9d6e3;
    margin: 14px 0;
  }

  .books-list-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6b7f96;
    margin-bottom: 8px;
  }

  .book-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 6px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    margin-bottom: 6px;
    font-size: 0.82rem;
    color: #374151;
  }
  .book-item span.dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #3b82f6;
    flex-shrink: 0;
  }

  /* ── BOX 2: Katalog Arama ── */
  .search-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .search-bar input {
    flex: 1;
    border: 1.5px solid #c9d6e3;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.85rem;
    background: #f8fafc;
    outline: none;
  }
  .search-bar input:focus { border-color: #3b82f6; background: #fff; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }

  .filter-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1.5px solid #c9d6e3;
    font-size: 0.75rem;
    cursor: pointer;
    color: #374151;
    background: #f8fafc;
    transition: all 0.15s;
    user-select: none;
  }
  .filter-chip input[type=checkbox] { accent-color: #3b82f6; }
  .filter-chip:hover { border-color: #3b82f6; color: #3b82f6; }

  .catalog-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }
  .catalog-table th {
    background: #f0f4f8;
    color: #6b7f96;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 7px 10px;
    text-align: left;
    border-bottom: 1.5px solid #c9d6e3;
  }
  .catalog-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #edf2f7;
    color: #374151;
    vertical-align: middle;
  }
  .catalog-table tr:last-child td { border-bottom: none; }
  .catalog-table tr:hover td { background: #f8fafc; }

  .tag {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 600;
    margin: 1px;
  }
  .tag-blue   { background: #dbeafe; color: #1d4ed8; }
  .tag-green  { background: #dcfce7; color: #166534; }
  .tag-yellow { background: #fef9c3; color: #854d0e; }
  .tag-purple { background: #ede9fe; color: #5b21b6; }
  .tag-gray   { background: #e2e8f0; color: #374151; }

  .status-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 700;
  }
  .status-available { background: #dcfce7; color: #166534; }
  .status-checked   { background: #fee2e2; color: #991b1b; }
  .status-active    { background: #dbeafe; color: #1d4ed8; }

  .btn-disa {
    background: #f0f4f8;
    border: 1.5px solid #c9d6e3;
    border-radius: 5px;
    padding: 4px 10px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    color: #374151;
    transition: all 0.15s;
  }
  .btn-disa:hover { background: #e0e7f0; border-color: #94a3b8; }

  /* ── BOX 3: Admin Girişi ── */
  .admin-login {
    display: grid;
    grid-template-columns: 1fr 32px 1fr;
    gap: 12px;
    align-items: center;
  }

  .login-form { display: flex; flex-direction: column; gap: 10px; }
  .login-form label { font-size: 0.75rem; font-weight: 600; color: #6b7f96; margin-bottom: 2px; }

  .admin-redirect {
    background: #f0fdf4;
    border: 1.5px solid #86efac;
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 0.82rem;
    color: #166534;
    line-height: 1.6;
  }
  .admin-redirect strong { display: block; font-size: 0.85rem; margin-bottom: 4px; }

  .password-hint {
    font-size: 0.72rem;
    color: #9aacbe;
    margin-top: 2px;
  }

  /* Giriş alanı + buton yan yana */
  .student-input-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .student-input-row .input-field {
    flex: 1;
  }

  @media (max-width: 600px) {
    .checkout-flow { grid-template-columns: 1fr; }
    .flow-arrow { padding-top: 0; transform: rotate(90deg); }
    .admin-login { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<h1 class="site-title">📚 Kütüphane Sistemi</h1>

<div class="screen-stack">

  <!-- ══════════════════════════════════
       BOX 1 — Kitap Ödünç Alma / İade
       ══════════════════════════════════ -->
  <div class="panel">
    <h2>Kitap Ödünç Alma / İade Etme</h2>

    <div class="checkout-flow" id="checkoutFlow">

      <!-- Left: Student Side -->
      <div class="flow-col" id="leftPanel">
        <p style="font-size:0.78rem;font-weight:700;color:#6b7f96;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;" id="girisLabel">Giriş</p>
        <div class="student-input-row" id="studentInputRow">
          <input class="input-field" type="text" placeholder="Öğrenci numaranızı girin" id="studentNo" />
          <button class="btn btn-primary" id="kitaplariOkutBtn" onclick="handleStudentSubmit()">Kitapları Okut</button>
        </div>
        <div id="nfcBox" style="display:none;margin-top:10px;">
          <div class="books-list-label" style="margin-bottom:6px;">📡 NFC ile Kitap Okut</div>
          <input class="input-field" type="text" id="nfcTagInput" placeholder="Kitabı NFC okuyucuya okutun..." autocomplete="off" />
          <div id="nfcStatus" style="font-size:0.72rem;color:#9aacbe;margin-top:4px;"></div>
        </div>

        <div id="booksSection" style="display:none;">
          <div class="books-list-label" style="margin-top:10px;">Ödünç Alınan Kitaplar</div>
          <div id="checkedOutBooks">
            <div style="font-size:0.8rem;color:#9aacbe;padding:6px 0;">Yükleniyor...</div>
          </div>
        </div>
      </div>

      <!-- Arrow (hidden until student number submitted) -->
      <div class="flow-arrow" id="flowArrow" style="display:none;">→</div>

      <!-- Right: System Response (hidden until student number submitted) -->
      <div class="flow-col" id="rightPanel" style="display:none;">
        <div class="greeting-box" id="greetingBox"></div>
        <button class="btn btn-danger" onclick="doLogout()">Çıkış Yap</button>

        <hr class="separator">

        <!-- Kitap arama + ödünç al -->
        <div style="display:flex;gap:6px;margin-bottom:6px;">
          <input class="input-field" type="text" id="bookSearchInput" placeholder="Kitap ara..." style="flex:1;font-size:0.8rem;" oninput="searchBooksForCheckout()" />
        </div>
        <div id="bookSearchResults" style="display:none;max-height:180px;overflow-y:auto;border:1.5px solid #c9d6e3;border-radius:6px;background:#fff;margin-bottom:8px;"></div>

        <!-- İşlem geçmişi -->
        <div id="transactionLog" style="display:flex;flex-direction:column;gap:6px;"></div>
      </div>
    </div>

    <hr class="separator">
    <p style="font-size:0.75rem;color:#9aacbe;text-align:center;">
      Kitap ödünç almak veya iade etmek için öğrenci numarasını giriniz.
    </p>
  </div>


  <!-- ══════════════════════════════════
       BOX 2 — Katalog / Kaynak Arama
       ══════════════════════════════════ -->
  <div class="panel">
    <h2>Katalog &amp; Kaynak Arama</h2>

    <p style="font-size:0.72rem;color:#9aacbe;margin-bottom:10px;">
      Dijital Erişim Adresi: <code style="color:#3b82f6;" id="ipAddress"></code>
    </p>

    <!-- Search bar -->
    <div class="search-bar">
      <input type="text" placeholder="🔍 Arama çubuğu..." id="searchInput" />
      <button class="btn btn-primary" onclick="doSearch()">Ara</button>
    </div>

    <!-- Filters -->
    <div class="filters">
      <label class="filter-chip"><input type="checkbox" class="type-filter" value="digital" checked onchange="doSearch()"> Dijital Kaynak</label>
      <label class="filter-chip"><input type="checkbox" class="type-filter" value="physical" checked onchange="doSearch()"> Basılı Kaynak</label>
      <span id="tagFilterContainer"></span>
    </div>

    <!-- Catalog table -->
    <table class="catalog-table">
      <thead>
        <tr>
          <th>Kaynak Adı</th>
          <th>Bilgiler</th>
          <th>Etiket</th>
          <th>Durum</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="catalogTableBody"></tbody>
    </table>
  </div>


  <!-- ══════════════════════════════════
       BOX 3 — Admin Girişi
       ══════════════════════════════════ -->
  <div class="panel">
    <h2>Admin Girişi</h2>

    <div class="admin-login">
      <!-- Login form -->
      <div class="login-form">
        <div>
          <label>Şifre</label>
          <input class="input-field" type="password" id="adminPass" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary" onclick="adminLogin()">Giriş</button>
        <div id="adminMsg" style="margin-top: 10px; padding: 8px; border-radius: 4px; display: none;"></div>
      </div>

    </div>
  </div>

</div><!-- end .screen-stack -->

<script>
  // Aktif öğrenci state'i
  let currentStudent = null;
  let allResources = [];       // katalogdan gelen tüm kaynaklar (arama için)
  let transactionLog = [];     // bu oturumda yapılan işlemler

  /* ── Öğrenci Doğrulama ── */
  function handleStudentSubmit() {
    const studentNo = document.getElementById('studentNo').value.trim();
    if (!studentNo) { alert('Lütfen öğrenci numarası girin.'); return; }

    const submitBtn = document.querySelector('#leftPanel .btn-primary');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Doğrulanıyor...';

    fetch('/api/student/validate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ student_number: studentNo })
    })
    .then(r => r.json())
    .then(data => {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Kitapları Okut';

      if (data.success) {
        currentStudent = data.student;
        transactionLog = [];

        // Öğrenci numarası girme textboxu ve "Kitapları Okut" butonu gizlenir
        document.getElementById('studentInputRow').style.display = 'none';
        document.getElementById('girisLabel').style.display = 'none';

        document.getElementById('greetingBox').innerHTML =
          `👋 Hoş geldin, <strong>${data.student.name}</strong>` +
          (data.student.class ? ` <span style="font-weight:400;color:#2563eb">(${data.student.class})</span>` : '');

        document.getElementById('booksSection').style.display = 'block';
        document.getElementById('nfcBox').style.display = 'block';
        document.getElementById('flowArrow').style.display = 'flex';
        const rightPanel = document.getElementById('rightPanel');
        rightPanel.style.display = 'flex';
        rightPanel.style.opacity = '0';
        rightPanel.style.transform = 'translateX(10px)';
        requestAnimationFrame(() => {
          rightPanel.style.transition = 'opacity 0.25s, transform 0.25s';
          rightPanel.style.opacity = '1';
          rightPanel.style.transform = 'translateX(0)';
        });

        loadCheckedOutBooks();
        renderTransactionLog();
        startNfcScan();
      } else {
        alert(data.message || 'Öğrenci bulunamadı.');
      }
    })
    .catch(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Kitapları Okut';
      alert('Bir hata oluştu. Lütfen tekrar deneyin.');
    });
  }

  document.getElementById('studentNo').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') handleStudentSubmit();
  });

  /* ── Çıkış ── */
  function doLogout() {
    currentStudent = null;
    transactionLog = [];
    stopNfcScan();
    document.getElementById('studentNo').value = '';
    document.getElementById('studentInputRow').style.display = 'flex';
    document.getElementById('girisLabel').style.display = 'block';
    document.getElementById('nfcBox').style.display = 'none';
    document.getElementById('nfcStatus').textContent = '';
    document.getElementById('nfcTagInput').value = '';
    document.getElementById('flowArrow').style.display = 'none';
    document.getElementById('rightPanel').style.display = 'none';
    document.getElementById('booksSection').style.display = 'none';
    document.getElementById('bookSearchInput').value = '';
    document.getElementById('bookSearchResults').style.display = 'none';
    document.getElementById('checkedOutBooks').innerHTML =
      '<div style="font-size:0.8rem;color:#9aacbe;padding:6px 0;">Yükleniyor...</div>';
    document.getElementById('studentNo').focus();
  }

  /* ── Ödünç Alınan Kitapları Getir ── */
  function loadCheckedOutBooks() {
    if (!currentStudent) return;
    const container = document.getElementById('checkedOutBooks');
    container.innerHTML = '<div style="font-size:0.8rem;color:#9aacbe;padding:6px 0;">Yükleniyor...</div>';

    fetch(`/api/transactions?student_id=${currentStudent.id}`)
    .then(r => r.json())
    .then(data => {
      if (!data.success) { container.innerHTML = '<div style="color:#991b1b;font-size:0.8rem;">Yüklenemedi.</div>'; return; }

      // Hangi kitaplar şu an ödünç alınmış? (son işlemi 'checkout' olanlar)
      const resourceMap = {};
      data.transactions.forEach(t => {
        // Her kaynak için sadece en son işlemi tut (zaten DESC sıralı geliyor)
        if (!resourceMap[t.resource_id]) {
          resourceMap[t.resource_id] = t;
        }
      });

      const checkedOut = Object.values(resourceMap).filter(t => t.transaction_type === 'checkout');

      container.innerHTML = '';
      if (checkedOut.length === 0) {
        container.innerHTML = '<div style="font-size:0.8rem;color:#9aacbe;padding:6px 0;">Ödünç alınan kitap yok.</div>';
        return;
      }

      checkedOut.forEach(t => {
        const item = document.createElement('div');
        item.className = 'book-item';
        item.style.justifyContent = 'space-between';
        item.innerHTML = `
          <span style="display:flex;align-items:center;gap:8px;">
            <span class="dot"></span>
            <span>${t.resource_title}</span>
          </span>
          <button class="btn-disa" onclick="returnBook(${t.resource_id}, '${escHtml(t.resource_title)}', this)"
            style="font-size:0.72rem;padding:3px 8px;color:#dc2626;border-color:#fca5a5;">
            İade Et
          </button>`;
        container.appendChild(item);
      });
    })
    .catch(() => {
      container.innerHTML = '<div style="color:#991b1b;font-size:0.8rem;">Bağlantı hatası.</div>';
    });
  }

  /* ── Kitap Arama (ödünç almak için) ── */
  function searchBooksForCheckout() {
    const query = document.getElementById('bookSearchInput').value.trim();
    const resultsEl = document.getElementById('bookSearchResults');

    if (!query) { resultsEl.style.display = 'none'; return; }

    fetch(`/api/resources?q=${encodeURIComponent(query)}`)
    .then(r => r.json())
    .then(data => {
      if (!data.success || data.resources.length === 0) {
        resultsEl.innerHTML = '<div style="padding:10px;font-size:0.8rem;color:#9aacbe;">Sonuç bulunamadı.</div>';
        resultsEl.style.display = 'block';
        return;
      }

      resultsEl.innerHTML = '';
      resultsEl.style.display = 'block';

      data.resources.forEach(res => {
        if (res.resource_type !== 'physical') return; // dijital ödünç alınmaz

        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #edf2f7;font-size:0.8rem;gap:8px;';

        const info = document.createElement('span');
        info.innerHTML = `<strong>${escHtml(res.title)}</strong>` +
          (res.author ? ` <span style="color:#6b7f96">— ${escHtml(res.author)}</span>` : '');
        row.appendChild(info);

        if (res.is_available) {
          const btn = document.createElement('button');
          btn.className = 'btn-disa';
          btn.textContent = '+ Ödünç Al';
          btn.style.cssText = 'font-size:0.72rem;padding:3px 8px;color:#166534;border-color:#86efac;white-space:nowrap;';
          btn.onclick = () => checkoutBook(res.id, res.title, btn);
          row.appendChild(btn);
        } else {
          const badge = document.createElement('span');
          badge.className = 'status-badge status-checked';
          badge.textContent = 'Ödünç Alındı';
          row.appendChild(badge);
        }

        resultsEl.appendChild(row);
      });
    })
    .catch(() => {
      resultsEl.innerHTML = '<div style="padding:10px;font-size:0.8rem;color:#991b1b;">Arama hatası.</div>';
      resultsEl.style.display = 'block';
    });
  }

  /* ── Ödünç Al ── */
  function checkoutBook(resourceId, title, btn) {
    if (!currentStudent) return;
    btn.disabled = true;
    btn.textContent = '...';

    fetch('/api/transactions/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ student_id: currentStudent.id, resource_id: resourceId })
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        addTransactionCard('checkout', title);
        document.getElementById('bookSearchInput').value = '';
        document.getElementById('bookSearchResults').style.display = 'none';
        loadCheckedOutBooks();
      } else {
        btn.disabled = false;
        btn.textContent = '+ Ödünç Al';
        alert(data.message || 'İşlem başarısız.');
      }
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = '+ Ödünç Al';
      alert('Bağlantı hatası.');
    });
  }

  /* ── İade Et ── */
  function returnBook(resourceId, title, btn) {
    if (!currentStudent) return;
    btn.disabled = true;
    btn.textContent = '...';

    fetch('/api/transactions/return', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ student_id: currentStudent.id, resource_id: resourceId })
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        addTransactionCard('return', title);
        loadCheckedOutBooks();
      } else {
        btn.disabled = false;
        btn.textContent = 'İade Et';
        alert(data.message || 'İşlem başarısız.');
      }
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = 'İade Et';
      alert('Bağlantı hatası.');
    });
  }

  /* ── NFC ile Kitap Okutma (R20C-USB) ──
     R20C-USB bir HID klavye-emülasyon okuyucudur: gerçek bir tarayıcı NFC
     API'siyle konuşmaz, okuttuğu kart/etiket numarasını "yazıyormuş gibi"
     hangi input alanı o sırada fokuslıysa oraya basar ve sonuna Enter (\n)
     ekler. Bu yüzden burada gerçek bir "tarama" yapılmıyor; öğrenci giriş
     yaptığında #nfcTagInput alanına sürekli fokus tutulur, okuyucunun
     yazdığı metin Enter ile tetiklenip backend'e gönderilir.
     Admin tarafında aynı mantıkla #bNfcTag alanına kart numarası okutulup
     kaynağa kaydedilir (bkz. admin.html). */
  let nfcRefocusInterval = null;

  function startNfcScan() {
    const input = document.getElementById('nfcTagInput');
    const statusEl = document.getElementById('nfcStatus');
    if (!input) return;

    input.value = '';
    input.focus();
    if (statusEl) statusEl.textContent = '📡 Hazır — kitabı NFC okuyucuya okutun.';

    // Öğrenci başka bir alana (örn. kitap arama kutusuna) tıklasa da
    // okuyucunun veriyi doğru yere yazabilmesi için fokusu periyodik
    // olarak NFC input'una geri al. Kullanıcı bilerek başka bir alana
    // yazı yazıyorsa (örn. arama kutusuna), o input fokustaysa dokunma.
    if (nfcRefocusInterval) clearInterval(nfcRefocusInterval);
    nfcRefocusInterval = setInterval(() => {
      const active = document.activeElement;
      const searchInput = document.getElementById('bookSearchInput');
      if (active === searchInput) return; // kullanıcı manuel arama yapıyor
      if (active !== input) input.focus();
    }, 1500);
  }

  function stopNfcScan() {
    if (nfcRefocusInterval) {
      clearInterval(nfcRefocusInterval);
      nfcRefocusInterval = null;
    }
  }

  document.getElementById('nfcTagInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const nfcTag = this.value.trim();
      this.value = '';
      if (nfcTag) handleNfcTagScanned(nfcTag);
    }
  });

  function handleNfcTagScanned(nfcTag) {
    if (!currentStudent) return;
    const statusEl = document.getElementById('nfcStatus');
    if (statusEl) statusEl.textContent = '🔎 Kontrol ediliyor...';

    fetch('/api/transactions/checkout-nfc', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ student_id: currentStudent.id, nfc_tag: nfcTag })
    })
      .then(r => r.json())
      .then(result => {
        if (result.success) {
          const title = result.transaction.resource_title;
          addTransactionCard('checkout', title);
          loadCheckedOutBooks();
          if (statusEl) statusEl.textContent = `✅ "${title}" NFC ile ödünç alındı.`;
        } else {
          if (statusEl) statusEl.textContent = '❌ ' + (result.message || 'İşlem başarısız.');
        }
      })
      .catch(() => {
        if (statusEl) statusEl.textContent = '❌ Bağlantı hatası.';
      })
      .finally(() => {
        document.getElementById('nfcTagInput').focus();
      });
  }


  function addTransactionCard(type, title) {
    transactionLog.unshift({ type, title, time: new Date() });
    renderTransactionLog();
  }

  function renderTransactionLog() {
    const el = document.getElementById('transactionLog');
    el.innerHTML = '';
    if (transactionLog.length === 0) return;

    transactionLog.forEach(t => {
      const card = document.createElement('div');
      const isCheckout = t.type === 'checkout';
      card.className = 'info-card';
      card.style.cssText = isCheckout
        ? ''
        : 'background:#f0fdf4;border-color:#86efac;color:#166534;';
      card.innerHTML = isCheckout
        ? `📖 <strong>${escHtml(t.title)}</strong> ödünç alındı.<br><span style="color:#666">${escHtml(currentStudent.name)} adlı öğrenci tarafından</span>`
        : `✅ <strong>${escHtml(t.title)}</strong> iade edildi.<br><span style="color:#14532d">${escHtml(currentStudent.name)} adlı öğrenci tarafından</span>`;
      el.appendChild(card);
    });
  }

  /* ── Yardımcı ── */
  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /*
 * Loads the shared tag catalog (same source admin.html reads/writes)
 * and renders it as filter chips, so the homepage always matches
 * whatever tags exist in the admin panel.
 */
function loadTagFilters() {
  fetch('/api/tags')
    .then(r => r.json())
    .then(data => {
      const container = document.getElementById('tagFilterContainer');
      if (!container || !data.success) return;

      container.innerHTML = '';
      data.tags.forEach(tagText => {
        const label = document.createElement('label');
        label.className = 'filter-chip';
        label.innerHTML = `<input type="checkbox" class="tag-filter" value="${tagText}" onchange="doSearch()"> ${tagText}`;
        container.appendChild(label);
      });
    })
    .catch(err => console.error('Tag filter load error:', err));
  }

  function doSearch() {
    const searchInput = document.getElementById('searchInput');
    const query = searchInput.value.trim();
    const booksListLabel = document.querySelector('.books-list-label');
    const catalogTableBody = document.querySelector('#catalogTableBody');

    // Show loading state in the catalog table
    if (catalogTableBody) {
      catalogTableBody.innerHTML = '<tr><td colspan="5">Kaynaklar yükleniyor...</td></tr>';
    }

    // Search via API
    fetch(`/api/resources?q=${encodeURIComponent(query)}`)
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          const checkedTypes = Array.from(document.querySelectorAll('.type-filter:checked')).map(cb => cb.value);
          const checkedTags = Array.from(document.querySelectorAll('.tag-filter:checked')).map(cb => cb.value);

          let filtered = data.resources.filter(r => checkedTypes.includes(r.resource_type));

          if (checkedTags.length > 0) {
            filtered = filtered.filter(r => {
              const tags = r.tags || '';
              return checkedTags.some(t => tags.includes(t));
            });
          }

          populateCatalogTable(filtered);
          if (booksListLabel) {
            booksListLabel.textContent = query
              ? `Arama Sonuçları (${filtered.length} kaynak bulundu)`
              : 'Kaynaklar';
          }
        } else {
          showErrorInCatalog('Kaynaklar yüklenirken bir hata oluştu.');
        }
      })
  }

  function populateCatalogTable(resources) {
    const catalogTableBody = document.querySelector('#catalogTableBody');
    if (!catalogTableBody) return;

    catalogTableBody.innerHTML = '';

    if (resources.length === 0) {
      const noDataRow = document.createElement('tr');
      noDataRow.innerHTML = '<td colspan="5">Aramanızla eşleşen kaynak bulunamadı.</td>';
      catalogTableBody.appendChild(noDataRow);
      return;
    }

    resources.forEach(resource => {
      const row = document.createElement('tr');
      const isDigital = resource.resource_type === 'digital';

      const nameCell = document.createElement('td');
      const nameStrong = document.createElement('strong');
      nameStrong.textContent = resource.title;
      nameCell.appendChild(nameStrong);

      const authorCell = document.createElement('td');
      authorCell.textContent = resource.author || '-';

      const tagsCell = document.createElement('td');
      tagsCell.textContent = resource.tags || '-';

      const statusCell = document.createElement('td');
      if (isDigital) {
        statusCell.textContent = '—';
      } else {
        const badge = document.createElement('span');
        badge.className = 'status-badge ' + (resource.is_available ? 'status-active' : 'status-checked');
        badge.textContent = resource.is_available ? 'Aktif' : 'Ödünç Alındı';
        statusCell.appendChild(badge);
      }

      const actionCell = document.createElement('td');
      if (isDigital) {
        const exportBtn = document.createElement('button');
        exportBtn.className = 'btn-disa';
        exportBtn.textContent = '📤 Dışa Aktar';
        exportBtn.addEventListener('click', () => downloadResource(resource.id, resource.title, resource.file_path));
        actionCell.appendChild(exportBtn);
      }

      row.append(nameCell, authorCell, tagsCell, statusCell, actionCell);
      catalogTableBody.appendChild(row);
    });
  }

  // Downloads a digital resource's file. Where supported, this lets the
  // user pick exactly where to save it (File System Access API); otherwise
  // it falls back to the browser's normal download behavior.
  async function downloadResource(resourceId, title, filePath) {
    const ext = filePath && filePath.includes('.') ? filePath.slice(filePath.lastIndexOf('.')) : '';
    const suggestedName = (title || 'dosya') + ext;

    try {
      const response = await fetch(`/api/resources/${resourceId}/download`);
      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        alert('Dışa aktarma başarısız: ' + (err.message || response.statusText));
        return;
      }
      const blob = await response.blob();

      if (window.showSaveFilePicker) {
        const handle = await window.showSaveFilePicker({ suggestedName });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = suggestedName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }
    } catch (error) {
      if (error.name !== 'AbortError') { // user cancelled the save dialog
        alert('Dışa aktarma sırasında bir hata oluştu: ' + error.message);
        console.error('Error:', error);
      }
    }
  }

  function showErrorInCatalog(message) {
    const catalogTableBody = document.querySelector('#catalogTable tbody');
    if (catalogTableBody) {
      catalogTableBody.innerHTML = `<tr><td colspan="5" style="color: #991b1b;">${message}</td></tr>`;
    }
  }

  function adminLogin() {
    const pass = document.getElementById('adminPass').value;
    const msg  = document.getElementById('adminMsg');

    // Show loading state
    msg.innerHTML = 'Doğrulama yapılıyor...';
    msg.style.background = '#fffbdd';
    msg.style.borderColor = '#fef08a';
    msg.style.color = '#92400e';
    msg.style.display = 'block';

    // Send AJAX request to validate admin credentials
    fetch('/api/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ password: pass })
    })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        msg.innerHTML = '<strong>✅ Giriş başarılı!</strong> Admin sayfasına yönlendiriliyorsunuz...';
        msg.style.background = '#f0fdf4';
        msg.style.borderColor = '#86efac';
        msg.style.color = '#166534';
        setTimeout(() => { window.location.href = 'admin.html'; }, 1000);
      } else {
        msg.innerHTML = '<strong>❌ Hatalı şifre.</strong> Lütfen tekrar deneyin.';
        msg.style.background = '#fff1f2';
        msg.style.borderColor = '#fecdd3';
        msg.style.color = '#991b1b';
      }
    })
    .catch(error => {
      msg.innerHTML = '<strong>❌ Bir hata oluştu.</strong> Lütfen tekrar deneyin.';
      msg.style.background = '#fff1f2';
      msg.style.borderColor = '#fecdd3';
      msg.style.color = '#991b1b';
      console.error('Error:', error);
    });
  }

document.addEventListener('DOMContentLoaded', function() {
  const ipAddressElement = document.getElementById('ipAddress');
  if (ipAddressElement) {
    ipAddressElement.textContent = window.location.host;
  }
  // Load tag filters, then the initial catalog data
  loadTagFilters();
  doSearch('');
});
</script></body>
